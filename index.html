<style>
:root{--ink:#18212e;--muted:#596779;--blue:#245ad5;--wash:#edf2fe;--page:#f5f7fb;--line:#dfe5ee;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%;position:relative;overflow-x:hidden}
body::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 82% 8%,#dbe7fd 0,rgba(219,231,253,0) 70%),radial-gradient(50% 40% at 8% 92%,#e6eefc 0,rgba(230,238,252,0) 70%);pointer-events:none}
header,main,footer{position:relative;width:min(1160px,calc(100% - 96px));margin-inline:auto}
header{padding:34px 0}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.65px;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo img{width:32px;height:32px;flex:none;display:block}
.logo b{font-weight:600;color:var(--blue)}
main{flex:1;display:flex;align-items:center;padding:24px 0 64px}
.panel{width:min(720px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:56px 56px 48px;box-shadow:0 30px 60px -36px #26395655}
.pill{display:inline-flex;align-items:center;gap:10px;margin:0 0 28px;padding:7px 15px 7px 12px;border-radius:999px;background:var(--wash);border:1px solid #d6e2f8;color:var(--blue);font:600 12px/1.2 var(--mono);letter-spacing:.11em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
h1{margin:0;font-size:clamp(34px,5.2vw,56px);line-height:1.08;font-weight:600;letter-spacing:-.045em}
h1 span{color:var(--blue)}
.lede{margin:22px 0 0;font-size:clamp(18px,2.2vw,22px);line-height:1.5;color:var(--muted);max-width:520px}
.rule{height:1px;background:var(--line);margin:40px 0 24px}
.contact{margin:0;font-size:15px;color:var(--muted)}
.contact a{color:var(--blue);font-weight:500;text-decoration:none;border-bottom:1px solid #b9cdf6}
.contact a:hover{border-bottom-color:var(--blue)}
.contact a:focus-visible{outline:2px solid var(--blue);outline-offset:4px;border-radius:2px}
footer{padding:0 0 32px;font:12px/1.5 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media(max-width:640px){header,main,footer{width:calc(100% - 40px)}header{padding:24px 0}.panel{padding:34px 24px 30px;border-radius:14px}.rule{margin:30px 0 20px}main{padding-bottom:40px}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style></head>
